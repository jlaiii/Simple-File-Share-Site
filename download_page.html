<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-lg mx-auto bg-white rounded-xl shadow-lg p-8 text-center">
        <h1 class="text-2xl font-bold text-slate-900">Ready to Download</h1>
        
        <div class="bg-slate-50 border border-slate-200 rounded-lg p-6 my-6">
            <p class="text-slate-500">You are about to download:</p>
            <!-- Jinja2 template variables will be inserted here by Flask -->
            <p id="fileName" class="text-xl font-semibold text-sky-800 break-words mt-2">{{ file_name }}</p>
            <p id="fileSize" class="text-slate-500 mt-1">{{ file_size }} MB</p>
        </div>
        
        <button id="downloadButton" class="w-full bg-sky-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-sky-700 transition-colors focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2 disabled:bg-slate-400 disabled:cursor-wait">
            Generate Download Link
        </button>
        
        <div id="statusMessage" class="mt-4 text-sm text-slate-500"></div>

    </div>

    <script>
        const downloadButton = document.getElementById('downloadButton');
        const statusMessage = document.getElementById('statusMessage');
        // This file_id is passed from the Python server when rendering the page
        const fileId = '{{ file_id }}'; 

        downloadButton.addEventListener('click', async () => {
            // Disable button to prevent multiple clicks
            downloadButton.disabled = true;
            downloadButton.textContent = 'Generating...';
            statusMessage.textContent = 'Please wait, we are creating your secure download link.';

            try {
                // Call the backend to get a temporary download link
                const response = await fetch(`/generate_download_link/${fileId}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    statusMessage.textContent = 'Link generated! Your download will start automatically.';
                    downloadButton.textContent = 'Download Starting...';
                    
                    // Redirect the browser to the temporary download link to start the download
                    window.location.href = data.download_link;
                    
                    // After a delay, re-enable the button in case the download fails to start
                    setTimeout(() => {
                        downloadButton.disabled = false;
                        downloadButton.textContent = 'Generate New Download Link';
                        statusMessage.textContent = 'If your download did not start, you can try again.';
                    }, 5000); // 5 seconds

                } else {
                    throw new Error(data.error || 'Failed to generate link.');
                }

            } catch (error) {
                console.error('Download link generation failed:', error);
                statusMessage.textContent = `Error: ${error.message}. Please try again.`;
                downloadButton.disabled = false;
                downloadButton.textContent = 'Try Again';
            }
        });
    </script>
</body>
</html>
