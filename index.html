<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple File Share</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better UX */
        body {
            font-family: 'Inter', sans-serif;
        }
        .drop-zone {
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
        .drop-zone--over {
            background-color: #e0f2fe; /* light-blue-100 */
            border-color: #38bdf8; /* light-blue-500 */
        }
        .progress-bar-fill {
            transition: width 0.3s ease-in-out;
        }
    </style>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-2xl mx-auto">
            <div class="bg-white rounded-xl shadow-lg p-8">
                <div class="text-center mb-6">
                    <h1 class="text-3xl font-bold text-slate-900">Simple File Share</h1>
                    <p class="text-slate-500 mt-2">Upload a file to get a shareable link. Files are deleted 3 days after their last download.</p>
                </div>

                <!-- Drag and Drop Zone -->
                <div id="dropZone" class="drop-zone border-4 border-dashed border-slate-300 rounded-lg p-10 text-center cursor-pointer">
                    <div class="flex flex-col items-center">
                        <svg class="w-16 h-16 text-slate-400 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l-3 3m3-3l3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
                        </svg>
                        <p class="text-lg font-medium">Drag & drop your file here</p>
                        <p class="text-slate-500">or <span class="text-sky-600 font-semibold">click to select a file</span></p>
                        <p class="text-xs text-slate-400 mt-2">Allowed types: ZIP, RAR, 7Z. Max size: 1GB</p>
                    </div>
                    <input type="file" id="fileInput" class="hidden" accept=".zip,.rar,.7z">
                </div>

                <!-- Status/Result Display -->
                <div id="statusContainer" class="mt-6 text-center">
                    <!-- Progress bar will be injected here -->
                    <!-- Link display will be injected here -->
                    <!-- Error messages will be injected here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer for Stats -->
    <footer class="text-center p-4 text-xs text-slate-400">
        <p id="statsDisplay">Loading stats...</p>
    </footer>

    <script>
        // --- Element References ---
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const statusContainer = document.getElementById('statusContainer');
        const statsDisplay = document.getElementById('statsDisplay');

        // --- Event Listeners ---
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) handleFileUpload(fileInput.files[0]);
        });
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drop-zone--over');
        });
        ['dragleave', 'dragend'].forEach(type => {
            dropZone.addEventListener(type, () => dropZone.classList.remove('drop-zone--over'));
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drop-zone--over');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileUpload(e.dataTransfer.files[0]);
            }
        });

        // --- Core Functions ---
        function handleFileUpload(file) {
            const allowedExtensions = ['zip', 'rar', '7z'];
            const fileExtension = file.name.split('.').pop().toLowerCase();
            if (!allowedExtensions.includes(fileExtension)) {
                displayError('Invalid file type. Please upload a ZIP, RAR, or 7Z file.');
                return;
            }
            if (file.size > 1 * 1024 * 1024 * 1024) { // 1 GB
                displayError('File is too large. The maximum size is 1GB.');
                return;
            }
            uploadFile(file);
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload', true);

            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    displayProgress(percentComplete, file.name);
                }
            };
            xhr.onloadstart = () => {
                statusContainer.innerHTML = '';
                dropZone.style.display = 'none';
            };
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    const response = JSON.parse(xhr.responseText);
                    // *** FIX: Use response.page_link which is sent by the server ***
                    displaySuccessLink(response.page_link); 
                } else {
                    try {
                        const errorResponse = JSON.parse(xhr.responseText);
                        displayError(errorResponse.error || 'An unknown upload error occurred.');
                    } catch {
                        displayError('An unknown server error occurred.');
                    }
                    resetUI();
                }
                fetchStats();
            };
            xhr.onerror = () => {
                displayError('A network error occurred. Please check your connection.');
                resetUI();
            };
            xhr.send(formData);
        }
        
        // --- UI Display Functions ---
        function displayProgress(percent, fileName) {
            statusContainer.innerHTML = `
                <div class="text-slate-600 mb-2">${fileName}</div>
                <div class="w-full bg-slate-200 rounded-full h-4">
                    <div id="progressBarFill" class="progress-bar-fill bg-sky-500 h-4 rounded-full" style="width: ${percent.toFixed(2)}%;"></div>
                </div>
                <div class="mt-2 text-sm text-slate-500">${percent.toFixed(0)}%</div>
            `;
        }

        function displayError(message) {
            statusContainer.innerHTML = `
                <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative" role="alert">
                    <strong class="font-bold">Error: </strong>
                    <span class="block sm:inline">${message}</span>
                </div>
                <button onclick="resetUI()" class="mt-4 px-4 py-2 bg-slate-600 text-white rounded-md hover:bg-slate-700 transition">Try Again</button>
            `;
        }

        function displaySuccessLink(link) {
            // This function now correctly receives the page link
            statusContainer.innerHTML = `
                <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-lg" role="alert">
                    <p class="font-bold">Upload Complete!</p>
                    <p>Share this link to the file page:</p>
                    <div class="mt-2 flex items-center bg-white p-2 rounded-md shadow-sm">
                        <input id="shareLinkInput" class="flex-grow bg-transparent outline-none" type="text" value="${link}" readonly>
                        <button onclick="copyLink()" class="ml-2 px-3 py-1 bg-sky-500 text-white rounded-md hover:bg-sky-600 transition">Copy</button>
                    </div>
                </div>
                 <button onclick="resetUI()" class="mt-4 px-4 py-2 bg-slate-600 text-white rounded-md hover:bg-slate-700 transition">Upload Another File</button>
            `;
        }
        
        function copyLink() {
            const linkInput = document.getElementById('shareLinkInput');
            linkInput.select();
            try {
                document.execCommand('copy');
                // A less intrusive notification
                const originalButtonText = this.event.target.textContent;
                this.event.target.textContent = 'Copied!';
                setTimeout(() => { this.event.target.textContent = originalButtonText; }, 2000);
            } catch (err) {
                alert('Failed to copy link.');
            }
        }
        
        function resetUI() {
            statusContainer.innerHTML = '';
            fileInput.value = '';
            dropZone.style.display = 'block';
        }
        
        async function fetchStats() {
            try {
                const response = await fetch('/stats');
                if (!response.ok) throw new Error('Could not fetch stats');
                const stats = await response.json();
                statsDisplay.textContent = `Stats: ${stats.active_files} active files | ${stats.current_storage_gb} GB used | ${stats.total_uploads_ever} total uploads`;
            } catch (error) {
                statsDisplay.textContent = 'Could not load stats.';
                console.error('Stats error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchStats);
    </script>

</body>
</html>
